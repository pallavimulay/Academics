<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Artium Academy — Course Slot Utilization Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --orange:#E07A29; --dark:#2B2118; --cream:#FBF3E7; --amber:#F5C77E;
  --green:#2E7D46; --red:#C13B3B; --border:#E7DCC9; --text:#2B2118; --sub:#7A6F5E;
  --card:#FFFFFF; --bg:#FAF6EF; --blue:#3B6EA5;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--dark);color:#fff;padding:20px 0;flex-shrink:0;}
.sidebar h1{font-size:15px;padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,0.15);color:var(--amber);}
.sidebar h1 span{display:block;font-size:11px;color:#cbbfa8;font-weight:normal;margin-top:4px;}
.nb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#e8ddc9;padding:12px 18px;font-size:13px;cursor:pointer;border-left:3px solid transparent;}
.nb:hover{background:rgba(255,255,255,0.06);}
.nb.active{background:rgba(224,122,41,0.18);border-left:3px solid var(--orange);color:#fff;font-weight:bold;}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#9A8B70;padding:16px 18px 6px;font-weight:bold;}
.main{flex:1;padding:26px 32px;max-width:1450px;}
.view{display:none;}
.view.active{display:block;}
.ph{margin-bottom:18px;}
.ph h1{font-size:22px;}
.ph p{color:var(--sub);font-size:13px;margin-top:4px;}
.banner{background:#FFF4E0;border:1px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:12px;color:#7A5A1E;margin-bottom:18px;}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.kpi-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.kpi-val{font-size:24px;font-weight:bold;}
.kpi-sub{font-size:11px;color:var(--sub);margin-top:4px;}
.kpi-val.warn{color:var(--red);} .kpi-val.ok{color:var(--green);} .kpi-val.amber{color:var(--orange);}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
.card h2{font-size:14px;margin-bottom:12px;}
.card h2 .sub{font-weight:normal;color:var(--sub);font-size:11px;display:block;margin-top:2px;}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tab{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--cream);text-align:left;padding:7px 9px;border-bottom:2px solid var(--border);position:sticky;top:0;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--sub);}
td{padding:6px 9px;border-bottom:1px solid var(--border);}
tr:hover td{background:#FFFBF3;}
tr.prime td{background:#FFF4E0;}
.tag{display:inline-block;font-size:10px;font-weight:bold;padding:2px 7px;border-radius:4px;}
.tag.red{background:#FBE2E2;color:#992222;}
.tag.green{background:#DEF3E4;color:#1F6B37;}
.tag.amber{background:#FCEACB;color:#8A5A10;}
.tag.grey{background:#EDE8DC;color:#7A6F5E;}
.hm-wrap{overflow-x:auto;}
.hm-grid{display:grid;grid-template-columns:120px repeat(24,1fr);gap:2px;font-size:9px;min-width:950px;}
.hm-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;color:#fff;font-weight:bold;}
.hm-label{display:flex;align-items:center;font-size:10px;color:var(--sub);}
.insight-list{list-style:none;}
.insight-list li{font-size:12.5px;line-height:1.6;padding:8px 0;border-bottom:1px solid var(--border);}
.insight-list li:last-child{border-bottom:none;}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:8px;align-items:center;flex-wrap:wrap;}
.legend .sw{width:12px;height:12px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle;}
canvas{max-height:280px;}
.small{font-size:11px;color:var(--sub);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.controls-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px;}
.ctrl{background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.ctrl label{font-size:11px;color:var(--sub);display:block;margin-bottom:6px;font-weight:bold;}
.ctrl input[type=number]{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:5px;font-size:13px;}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.toggle-row select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;}
.genre-block{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#FFFEFB;}
.genre-block h3{font-size:13px;margin-bottom:8px;}
.zone-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
</style>
</head>

// ===================== GENERIC TABLE SORTING =====================
// Makes any <table>'s first row of <th> cells clickable to sort the body rows.
// Rows that look like a "Total"/summary row (bold + cream background, or class="no-sort") stay pinned at the bottom.
function cellSortValue(td){
  const text = (td.textContent || '').trim();
  const cleaned = text.replace(/[,%]/g,'').replace(/^[+\u2212-]/,(m)=>m==='\u2212'?'-':m);
  const num = parseFloat(cleaned);
  if(!isNaN(num) && /^[+\-]?[\d.]+$/.test(cleaned)) return {num, text};
  return {num: null, text: text.toLowerCase()};
}
function isPinnedRow(tr){
  if(tr.classList.contains('no-sort')) return true;
  const style = tr.getAttribute('style') || '';
  if(style.includes('font-weight:bold') || style.includes('background:var(--cream)')) return true;
  if(tr.querySelectorAll('td').length===0) return true; // header-only or malformed row
  return false;
}
function makeSortable(table){
  if(!table || table.dataset.sortBound==='1') return;
  const headerRow = table.querySelector('tr');
  if(!headerRow) return;
  const ths = Array.from(headerRow.querySelectorAll('th'));
  if(ths.length===0) return;
  table.dataset.sortBound='1';
  let sortState = {col:-1, dir:1};
  ths.forEach((th, colIdx)=>{
    th.style.cursor='pointer';
    th.title = 'Click to sort';
    th.addEventListener('click', ()=>{
      const allRows = Array.from(table.querySelectorAll('tr')).slice(1); // skip header
      const pinned = allRows.filter(isPinnedRow);
      const sortable = allRows.filter(r=>!isPinnedRow(r));
      sortState.dir = (sortState.col===colIdx) ? -sortState.dir : 1;
      sortState.col = colIdx;
      sortable.sort((r1,r2)=>{
        const c1 = r1.querySelectorAll('td')[colIdx], c2 = r2.querySelectorAll('td')[colIdx];
        if(!c1||!c2) return 0;
        const v1 = cellSortValue(c1), v2 = cellSortValue(c2);
        let cmp;
        if(v1.num!==null && v2.num!==null) cmp = v1.num - v2.num;
        else cmp = v1.text.localeCompare(v2.text);
        return cmp * sortState.dir;
      });
      ths.forEach((t,i)=>{ t.innerHTML = t.innerHTML.replace(/ ?[\u25B2\u25BC]$/,''); });
      th.innerHTML += sortState.dir===1 ? ' \u25B2' : ' \u25BC';
      const tbody = table.tBodies[0] || table;
      sortable.forEach(r=>tbody.appendChild(r));
      pinned.forEach(r=>tbody.appendChild(r));
    });
  });
}
function makeAllTablesSortable(root){
  const scope = root || document;
  scope.querySelectorAll('table').forEach(t=>makeSortable(t));
}

function utilColor(u){
  if(u>=80) return '#C13B3B';
  if(u>=60) return '#E07A29';
  if(u>=35) return '#4C9A6B';
  if(u>0) return '#8FBFA0';
  return '#EDE8DC';
}
function fmt(n){ return Math.round(n).toLocaleString(); }

function showSlotDetail(cat, day, hour){
  const cell = DATA.hourly_by_day[cat][day].find(r=>r.hour===hour);
  if(!cell) return;
  const bpt = cell.teachers>0 ? Math.round(cell.booked/cell.teachers*10)/10 : 0;
  const available = Math.max(0, cell.given - cell.booked);
  const box = document.getElementById('slotDetail');
  if(!box) return;
  const dayAvail = DATA.teacher_avail_by_day[cat] && DATA.teacher_avail_by_day[cat][day];
  const names = (dayAvail && dayAvail[hour]) || [];
  const namesHtml = names.length
    ? names.map(n=>`<span class="tag grey" style="margin:2px">${n}</span>`).join('')
    : `<span class="small">No teachers from the Jul-Dec 2026 survey marked ${day} at this hour available yet (survey response coverage is partial — this list will fill in as more teachers respond).</span>`;
  box.innerHTML = `
    <div style="margin-top:14px;padding:14px 16px;background:#FFF8ED;border:1px solid var(--amber);border-radius:8px">
      <div style="font-size:13px;font-weight:bold;margin-bottom:10px">${cat} &middot; ${day} &middot; ${hour}:00 IST</div>
      <div class="grid3" style="gap:10px">
        <div class="kpi"><div class="kpi-label">Teachers Available (booking system)</div><div class="kpi-val">${Math.round(cell.teachers)}</div></div>
        <div class="kpi"><div class="kpi-label">Students Booked</div><div class="kpi-val ${cell.util>=80?'warn':'ok'}">${fmt(cell.booked)}</div><div class="kpi-sub">≈ student bookings this slot</div></div>
        <div class="kpi"><div class="kpi-label">Utilization</div><div class="kpi-val">${cell.util}%</div><div class="kpi-sub">${fmt(cell.given)} given &middot; ${fmt(available)} available</div></div>
      </div>
      <div class="small" style="margin-top:8px">Bookings per teacher in this slot: <b>${bpt}</b>. Since Artium classes are 1:1, "students booked" is a close proxy for bookings in that hour (summed across every ${day} in the ${PERIOD_LABEL} window, not a single occurrence).</div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--amber)">
        <div style="font-size:12px;font-weight:bold;margin-bottom:6px">Teachers who marked ${day} at this hour available (Jul-Dec 2026 survey)</div>
        <div>${namesHtml}</div>
        <div class="small" style="margin-top:6px">This name list comes from the Jul-Dec 2026 availability survey's ${day} column, not the historical booking system — survey response coverage is partial, so the count of names here won't exactly match the "${Math.round(cell.teachers)} teachers available" figure above, which is drawn from actual booking data.</div>
      </div>
    </div>
  `;
}

  const regColors = {'India':'#E07A29','US/Canada':'#3B6EA5','UK':'#8B5A9E','Australia/NZ':'#2E7D46','Gulf':'#C13B3B','SE Asia':'#B8860B','Europe':'#5A8FA0','Other':'#9A9184'};
  new Chart(document.getElementById('chartRegion'), {
    type:'bar',
    data:{labels:CATS, datasets:regions.map(r=>({label:r, data:CATS.map(c=>DATA.region[c][r]||0), backgroundColor:regColors[r]}))},
    options:{responsive:true, scales:{x:{stacked:true}, y:{stacked:true}}, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:9}}}}}
  });
  new Chart(document.getElementById('chartNightEve'), {
    type:'bar',
    data:{labels:CATS,
      datasets:[
        {label:'US-Prime (1-6am IST)', data:CATS.map(c=>DATA.night_eve[c].night_0_6.util), backgroundColor:'#3B6EA5'},
        {label:'India-Evening (6-10pm IST)', data:CATS.map(c=>DATA.night_eve[c].evening_18_22.util), backgroundColor:'#E07A29'},
      ]},
    options:{responsive:true, scales:{y:{beginAtZero:true, title:{display:true,text:'Utilization %'}}}, plugins:{legend:{position:'bottom'}}}
  });
  let html = `<tr><th>Category</th><th>Total Students</th><th>% Outside India</th><th>US/Canada</th><th>UK</th><th>Australia/NZ</th><th>Gulf</th><th>SE Asia</th><th>Europe</th></tr>`;
  CATS.forEach(c=>{
    const r = DATA.region[c];
    const nonIndia = Math.round(100*(r.Total-(r.India||0))/r.Total*10)/10;
    html += `<tr><td>${c}</td><td>${fmt(r.Total)}</td><td><b>${nonIndia}%</b></td><td>${r['US/Canada']||0}</td><td>${r['UK']||0}</td><td>${r['Australia/NZ']||0}</td><td>${r['Gulf']||0}</td><td>${r['SE Asia']||0}</td><td>${r['Europe']||0}</td></tr>`;
  });
  document.getElementById('globalTable').innerHTML = html;

  // Prime-time utilization across 6 zones incl. IST -- EST+PST combined into one "US" entry,
  // since student data can't tell us which coast someone is on.
  const GLOBAL_ZONE_KEYS = ['IST','US','UK','Australia','Singapore','MiddleEast'];
  const zoneSummaries = GLOBAL_ZONE_KEYS.map(zk=>{
    let rows, label, students;
    if(zk==='US'){
      const est = DATA.tz_map['EST'], pst = DATA.tz_map['PST'];
      rows = [...est.rows.filter(r=>r.is_prime), ...pst.rows.filter(r=>r.is_prime)];
      label = 'US (EST + PST combined)';
      students = est.students; // same full US total under both, not additive
    } else {
      const z = DATA.tz_map[zk];
      rows = z.rows.filter(r=>r.is_prime);
      label = z.label;
      students = z.students;
    }
    const given = rows.reduce((a,r)=>a+r.given_monthly,0);
    const booked = rows.reduce((a,r)=>a+r.booked_monthly,0);
    const available = rows.reduce((a,r)=>a+r.available_monthly,0);
    const teachers = rows.length ? Math.round(rows.reduce((a,r)=>a+r.teachers,0)/rows.length) : 0;
    const util = given ? Math.round(100*booked/given*10)/10 : 0;
    const bpt = teachers>0 ? Math.round(booked/teachers*10)/10 : 0;
    return {zk, label, students, given, booked, available, teachers, util, bpt};
  });
  new Chart(document.getElementById('chartZonePrime'), {
    type:'bar',
    data:{labels: zoneSummaries.map(s=>s.label),
      datasets:[{label:'Local Evening-Prime Utilization %', data: zoneSummaries.map(s=>s.util), backgroundColor: zoneSummaries.map(s=>s.zk==='IST'?'#E07A29':'#3B6EA5')}]},
    options:{responsive:true, scales:{y:{beginAtZero:true, title:{display:true,text:'Utilization %'}}}, plugins:{legend:{display:false}}}
  });
  let zh = `<tr><th>Region</th><th>Active Students</th><th>Slots Given (prime)</th><th>Slots Booked (prime)</th><th>Slots Available (prime)</th><th>Util %</th><th>Avg Teachers Available</th><th>Bookings / Teacher</th></tr>`;
  zoneSummaries.forEach(s=>{
    zh += `<tr${s.zk==='IST'?' style="background:#FFF8ED"':''}><td>${s.label}</td><td>${fmt(s.students)}</td><td>${fmt(s.given)}</td><td>${fmt(s.booked)}</td><td>${fmt(s.available)}</td><td><span class="tag" style="background:${utilColor(s.util)};color:#fff">${s.util}%</span></td><td>${s.teachers}</td><td>${s.bpt}</td></tr>`;
  });
  document.getElementById('zonePrimeTable').innerHTML = zh;

  makeAllTablesSortable(document.getElementById('view-global'));}

// ===================== TEACHER INSIGHTS =====================
let teachCat = 'Vocal-North';
let teachFilter = 'all';
let teachSort = {col:'students', dir:'desc'};
function renderTeachers(){
  const el = document.getElementById('view-teachers');
  const list = DATA.roster[teachCat];
  const detail = DATA.teacher_detail || {};
  const merged = list.map(r=>{
    const key = r.name.toLowerCase().replace(/\s+/g,' ').trim();
    const d = detail[key];
    return {
      name: r.name, students: r.students,
      slotsGiven: d?d.totalSlotsGiven:null, util: d?d.slotUtil:null,
      overallQA: d?d.overallQA:null, academicQA: d?d.academicQA:null,
      payout: d?d.payoutCategory:null, classesConducted: d?d.classesConducted:null,
      cps: d?d.classesPerActiveStudent:null, cpel: d?d.classesPerEngagedLearner:null,
      flag: d?d.flag:null,
    };
  });
  const zeroN = list.filter(x=>x.students===0).length;
  const incN = merged.filter(x=>x.flag==='increase').length;
  const redN = merged.filter(x=>x.flag==='reduce').length;
  const matchedN = merged.filter(x=>x.util!==null).length;
  const qaMatchedN = merged.filter(x=>x.overallQA!==null).length;

  el.innerHTML = `
    <div class="ph"><h1>Teacher Insights</h1><p>Full per-teacher view — active student load, slot utilization, quality, and payout tier</p></div>
    <div class="banner">Slot utilization, class-load columns, and payout tier come from the teacher-report-2026-07 monthly report card (${matchedN} of ${list.length} matched). Overall QA Score and QA Score (Academic) come separately from the Q2 2026 quarterly QA report (${qaMatchedN} of ${list.length} matched to Q2 QA data). Unmatched rows show "—" for whichever source didn't have that teacher. The Flag column reuses the same thresholds as Slot Adjustment Recs: <span class="tag green">Increase</span> = util &ge;65% &amp; active students &ge;15; <span class="tag red">Reduce</span> = util &le;20% &amp; slots given &ge;100. Click any column header to sort.</div>
    <div class="card"><div class="tabs" id="teachCatTabs"></div>
      <div class="grid3" style="margin-bottom:14px">
        <div class="kpi"><div class="kpi-label">Teachers</div><div class="kpi-val">${list.length}</div></div>
        <div class="kpi"><div class="kpi-label">Zero Active Students</div><div class="kpi-val warn">${zeroN}</div></div>
        <div class="kpi"><div class="kpi-label">Avg Students / Teacher</div><div class="kpi-val">${(list.reduce((a,x)=>a+x.students,0)/list.length).toFixed(1)}</div></div>
      </div>
      <div class="tabs">
        <button class="tab${teachFilter==='all'?' active':''}" onclick="teachFilter='all';renderTeachers()">All (${list.length})</button>
        <button class="tab${teachFilter==='zero'?' active':''}" onclick="teachFilter='zero';renderTeachers()">Zero students (${zeroN})</button>
        <button class="tab${teachFilter==='increase'?' active':''}" onclick="teachFilter='increase';renderTeachers()">Increase flag (${incN})</button>
        <button class="tab${teachFilter==='reduce'?' active':''}" onclick="teachFilter='reduce';renderTeachers()">Reduce flag (${redN})</button>
      </div>
      <table id="teachTable"></table>
    </div>
  `;
  const tabs = document.getElementById('teachCatTabs');
  CATS.forEach(c=>{
    const b=document.createElement('button'); b.className='tab'+(c===teachCat?' active':''); b.textContent=c;
    b.onclick=()=>{teachCat=c; renderTeachers();};
    tabs.appendChild(b);
  });

  let rows = merged;
  if(teachFilter==='zero') rows = rows.filter(x=>x.students===0);
  if(teachFilter==='increase') rows = rows.filter(x=>x.flag==='increase');
  if(teachFilter==='reduce') rows = rows.filter(x=>x.flag==='reduce');

  const {col, dir} = teachSort;
  rows = [...rows].sort((a,b)=>{
    let av=a[col], bv=b[col];
    if(av===null) av = dir==='asc'?Infinity:-Infinity;
    if(bv===null) bv = dir==='asc'?Infinity:-Infinity;
    if(typeof av==='string') return dir==='asc'? av.localeCompare(bv) : bv.localeCompare(av);
    return dir==='asc'? av-bv : bv-av;
  });

  const cols = [
    {key:'name', label:'Teacher'}, {key:'students', label:'Active Students'},
    {key:'slotsGiven', label:'Slots Given'}, {key:'util', label:'Util %'},
    {key:'classesConducted', label:'Classes Conducted'}, {key:'cps', label:'Classes/Active Student'},
    {key:'cpel', label:'Classes/Engaged Learner'}, {key:'overallQA', label:'Overall QA Score'},
    {key:'academicQA', label:'QA Score (Academic)'}, {key:'payout', label:'Payout Tier'}, {key:'flag', label:'Flag'},
  ];
  const sortArrow = (k)=> teachSort.col===k ? (teachSort.dir==='asc'?' ▲':' ▼') : '';
  let html = `<tr>${cols.map(c=>`<th style="cursor:pointer" onclick="teachSort.col==='${c.key}'?teachSort.dir=(teachSort.dir==='asc'?'desc':'asc'):teachSort={col:'${c.key}',dir:'desc'}; renderTeachers();">${c.label}${sortArrow(c.key)}</th>`).join('')}</tr>`;
  rows.forEach(r=>{
    const flagTag = r.flag==='increase' ? '<span class="tag green">Increase</span>' : r.flag==='reduce' ? '<span class="tag red">Reduce</span>' : r.flag==='ok' ? '<span class="tag grey">OK</span>' : '—';
    html += `<tr><td>${r.name}</td><td>${r.students}${r.students===0?' <span class="tag red">Zero</span>':''}</td>`+
      `<td>${r.slotsGiven??'—'}</td><td>${r.util!==null?r.util+'%':'—'}</td>`+
      `<td>${r.classesConducted??'—'}</td><td>${r.cps??'—'}</td><td>${r.cpel??'—'}</td>`+
      `<td>${r.overallQA??'—'}</td><td>${r.academicQA??'—'}</td><td>${r.payout??'—'}</td><td>${flagTag}</td></tr>`;
  });
  document.getElementById('teachTable').innerHTML = html;

  makeAllTablesSortable(document.getElementById('view-teachers'));}

let horizonMonths = 6;
let forecastGenre = 'North Vocals';
const AT_RISK_LOOKUP = {};
(DATA.at_risk||[]).forEach(r=>{ AT_RISK_LOOKUP[r.genre] = r; });
let genreInputs = {};
GENRES.forEach(g=>{
  genreInputs[g] = {
    targetUtil: 80, domGrowth: G[g].fixed_dom_growth||0, intlGrowth: G[g].fixed_intl_growth||0, bookedHoursPerStudent: 3.5,
    teachers: G[g].teachers, annualAttrition: G[g].annual_attrition_rate,
    hoursPerTeacherMonth: G[g].given_hours_per_teacher_monthly,
    churnRiskPct: G[g].renewal_churn_pct||0,
  };
});
const DEFAULT_GENRE_INPUTS = JSON.parse(JSON.stringify(genreInputs)); // frozen snapshot for Hiring Summary, unaffected by user edits

// We only have confirmed teacher departure counts through June 2026 (the 63-departure Jan-Jun figure).
// July and August departures are unknown -- estimate them using each genre's own derived monthly attrition
// rate, applied to current headcount, so backfill targets aren't silently assuming zero attrition since June.
function estimatedMonthlyAttrition(g){
  return G[g].teachers * (G[g].monthly_attrition_rate/100);
}
function effectiveBackfillGap(g, unknownMonths){
  // unknownMonths = how many months beyond the known Jan-Jun window need rate-based estimation (0, 1, or 2)
  return (G[g].attrition_6mo||0) + estimatedMonthlyAttrition(g) * unknownMonths;
}

const REGION_TO_ZONE = {
  'US/Canada': ['US'], 'UK': ['UK'], 'Europe': ['UK'],
  'Australia/NZ': ['Australia'], 'Gulf': ['MiddleEast'], 'SE Asia': ['Singapore'], 'Other': [],
};
const GENRE_TO_CAT = {
  'North Vocals':'Vocal-North', 'South Vocals':'Vocal-South', 'Western Vocals':'Vocal Western',
  'Guitar':'Instrument-Guitar', 'Keyboard':'Instrument-Piano',
};

function computeForecast(g, months, inputsOverride){
  const d = G[g];
  const inp = inputsOverride || genreInputs[g];
  const churnFrac = (inp.churnRiskPct||0)/100;
  const domFrac = inp.domGrowth/100 - churnFrac, intlFrac = inp.intlGrowth/100 - churnFrac;
  const targetUtilFrac = inp.targetUtil/100;
  const bhps = inp.bookedHoursPerStudent;
  const teachers = inp.teachers;
  const monthlyAttritionRate = inp.annualAttrition/12/100;
  const series = [];
  for(let m=0; m<=months; m++){
    const domStudents = d.domestic_students * Math.pow(1+domFrac, m);
    const intlStudents = d.international_students * Math.pow(1+intlFrac, m);
    const totalStudents = domStudents + intlStudents;
    const domBookedHours = domStudents * bhps;
    const intlBookedHours = intlStudents * bhps;
    const projBookedMonthly = domBookedHours + intlBookedHours;
    const requiredGivenMonthly = projBookedMonthly / targetUtilFrac;
    const requiredTeachers = requiredGivenMonthly / inp.hoursPerTeacherMonth;
    const attritionProjected = teachers * monthlyAttritionRate * m;
    const teachersRemaining = teachers - attritionProjected;
    const totalHiresNeeded = Math.max(0, requiredTeachers - teachersRemaining);
    const replacementComponent = Math.min(attritionProjected, totalHiresNeeded);
    const growthComponent = totalHiresNeeded - replacementComponent;
    const deltaDom = Math.max(0, domBookedHours - d.domestic_students*bhps);
    const deltaIntl = Math.max(0, intlBookedHours - d.international_students*bhps);
    const deltaTotal = deltaDom + deltaIntl;
    const growthDom = deltaTotal>0 ? growthComponent*(deltaDom/deltaTotal) : growthComponent;
    const growthIntl = growthComponent - growthDom;
    series.push({m, domStudents, intlStudents, totalStudents, requiredTeachers, teachersRemaining,
      totalHiresNeeded, replacementComponent, growthComponent, growthDom, growthIntl});
  }
  return series;
}

function allocateToZones(g, domHires, intlHires){
  const pct = G[g].region_pct;
  const intlTotalPct = 100 - pct['India'];
  const zoneHires = {IST:0, US:0, UK:0, Australia:0, Singapore:0, MiddleEast:0, Other:0};
  zoneHires.IST += domHires;
  if(intlTotalPct>0){
    Object.keys(REGION_TO_ZONE).forEach(region=>{
      const share = (pct[region]||0)/intlTotalPct;
      const zones = REGION_TO_ZONE[region];
      if(zones.length===0){ zoneHires.Other += intlHires*share; return; }
      const perZone = intlHires*share/zones.length;
      zones.forEach(z=> zoneHires[z]+=perZone );
    });
  }
  return zoneHires;
}

  let hHtml = `<tr><th>IST Hour</th><th>Current Given</th><th>Current Booked</th><th>Current Util %</th><th>Backfill Need</th><th>Growth Need</th><th>Total Hiring Need</th></tr>`;
  hourAlloc.forEach(r=>{
    if(r.total<0.05 && r.given===0) return; // skip fully empty hours for readability
    hHtml += `<tr><td>${r.hour}:00</td><td>${fmt(r.given)}</td><td>${fmt(r.booked)}</td><td><span class="tag" style="background:${utilColor(r.util)};color:#fff">${r.util}%</span></td><td>${r.backfillShare>=0.05?fmt1(r.backfillShare):'—'}</td><td>${r.growthShare>=0.05?fmt1(r.growthShare):'—'}</td><td><b>${r.total>=0.05?fmt1(r.total):'—'}</b></td></tr>`;

  el.innerHTML = `
    <div class="ph"><h1>Hiring Summary</h1><p>One-page rollup across all genres, using current defaults (not whatever's currently edited on the Hiring Forecast tab)</p></div>
    <div class="banner">This sheet always uses the original data-derived defaults regardless of what you've changed on the Hiring Forecast tab — a stable snapshot to share or print. Attrition rate, churn rate, and slots-given-per-teacher-per-month are each pulled <b>per genre</b> from that genre's own data, not a company-wide average — e.g. Western Vocals uses its own 33.3% attrition and 12.69% churn, Guitar uses its own 38.1%/10.11%, and so on. <b>Proj Util</b> = utilization you'd actually see at the chosen horizon if no new hires are added (demand grows/shrinks per default growth &amp; churn, teacher count only erodes via attrition). <b>Immediate Backfill (remaining)</b> = the Jan-Jun 2026 departures (63 confirmed) not yet replaced by Jul-Aug hiring, <b>plus an estimated month of July attrition</b> (using each genre's own derived monthly rate, since we don't have July's actual departure count yet) — this avoids crediting all Jul-Aug hiring against only the known Jan-Jun gap, which would silently assume zero attrition happened since June. <b>Hire to 80% (${hsHorizon}mo)</b> = teachers to hire by the horizon so utilization lands at the 80% target, given projected growth and attrition, plus Immediate Backfill. <b>New HC Total (${hsHorizon}mo)</b> = the resulting total headcount target (current teachers + Hire to 80%) — the number to actually plan toward, not just the delta.</p>
    <div class="card">
      <div class="toggle-row">
        <label class="small" style="font-weight:bold">Horizon:</label>
        <select id="hsHorizonSelect" onchange="hsHorizon=parseInt(this.value); renderHiringSummary();">
          ${[3,6,12,18,24].map(m=>`<option value="${m}" ${m===hsHorizon?'selected':''}>${m} months</option>`).join('')}
        </select>
      </div>
      <table id="hiringSummaryTable"></table>
    </div>
    <div class="card"><h2>Signal Key</h2>
      <ul class="insight-list">
        <li><span class="tag red">Critical</span>&nbsp; Current utilization &ge;75% (little slack left) or New HC &ge;20% of current teacher base — act now.</li>
        <li><span class="tag amber">Watch</span>&nbsp; Current utilization 55-75%, or a meaningful but not urgent hiring gap — plan ahead.</li>
        <li><span class="tag green">Healthy</span>&nbsp; Comfortable utilization and small hiring gap relative to current headcount.</li>
      </ul>
    </div>
    <div class="card"><h2>Q3 Hiring Progress: Jul-Aug-Sep 2026<span class="sub"><b>Data as of Aug 12, 2026 — August isn't over.</b> "Aug Hired" is a running count, not a final one; more hiring is expected before month-end, so treat any "more needed by Aug 31" flag as a mid-month check-in, not a missed target. Targets are net of actual hires already made — Aug's target subtracts July's hires, Sep's target subtracts both July and August's. <b>Half of September's growth-driven hiring need is pulled forward into August</b> — growth builds continuously, not overnight in September, and hiring has lead time, so recruiting for next month's growth should start now rather than waiting for the calendar to flip. <b>The Aug/Sep split can never claim more total need than the overall Hire to 80% Target says is left</b> — if a genre has already met or exceeded its 3-month target (shown as ≥100% filled), both monthly figures show 0, not a leftover monthly ask that contradicts the summary. Hire to 80% Target is fixed at a 3-month horizon (matching the quarter) using each genre's own current given-hours-per-teacher-per-month, independent of the Hiring Forecast tab's own horizon setting. We don't have confirmed departure counts for July or August yet — targets add an estimated month of attrition (using each genre's own derived monthly rate) for each unconfirmed month, so hiring credit isn't silently assuming zero attrition since June.</span></h2>
      <table id="q3ProgressTable" style="margin-bottom:16px"></table>
      <div class="tabs">
        <button class="tab${q3View==='all'?' active':''}" onclick="q3View='all';renderHiringSummary()">All (${(DATA.q3_hires||[]).length})</button>
        <button class="tab${q3View==='active'?' active':''}" onclick="q3View='active';renderHiringSummary()">Active/Teacher</button>
        <button class="tab${q3View==='te'?' active':''}" onclick="q3View='te';renderHiringSummary()">TE Only (not yet counted)</button>
      </div>
      <table id="q3DetailTable"></table>
      <p class="small" style="margin-top:8px">"TE Only" rows are excluded from the teacher counts used everywhere else in this dashboard, per the working assumption that TE status means not-yet-fully-active — flag if that's wrong and these should be counted.</p>
    </div>
    <div class="card"><h2>New Hire Shift Coverage vs. What's Actually Needed<span class="sub">From submitted weekly availability for 76 recently onboarded teachers (batches 149-155) — does what they're available for match the demand-driven shift split from the Hiring Forecast?</span></h2>
      <table id="shiftMismatchTable"></table>
      <p class="small" style="margin-top:8px">"Demand Needs" comes from the Hiring Forecast's Which-Shift-To-Hire-For split (student geography, current defaults). "New Hires Covering" counts how many of these teachers marked <i>any</i> availability in that shift window (Morning 6am-2pm, Afternoon 2pm-10pm, Night 10pm-6am IST) — not exclusively, so a teacher can count toward more than one shift.</p>
    </div>
  `;
  let html = `<tr><th>Genre</th><th>Cur Teachers</th><th>Students</th><th>S:T</th><th>Current Util</th><th>Proj Util (${hsHorizon}mo)</th><th>Immediate Backfill (remaining)</th><th>Hire to 80% (${hsHorizon}mo)</th><th>New HC Total (${hsHorizon}mo)</th><th>Signal</th></tr>`;
  const q3ActiveAll = (DATA.q3_hires||[]).filter(r=>r.active);
  GENRES.forEach(g=>{
    const inp = DEFAULT_GENRE_INPUTS[g];
    const d = G[g];
    const series = computeForecast(g, hsHorizon, inp);
    const sH = series[hsHorizon];
    const q3HiredCount = q3ActiveAll.filter(r=>r.genre===g).length;
    const backfill = Math.max(0, effectiveBackfillGap(g,1) - q3HiredCount); // net of actual Jul+Aug hires against known Jan-Jun gap plus an estimated month of unconfirmed July attrition
    const hireTo80 = Math.round(sH.totalHiresNeeded) + backfill; // teachers to hire, by the horizon, to hit 80% target given projected growth + attrition + remaining backfill
    const newHCTotal = inp.teachers + hireTo80; // total headcount target after hiring
    const projUtilPct = Math.round((sH.totalStudents*inp.bookedHoursPerStudent) / (sH.teachersRemaining*inp.hoursPerTeacherMonth) * 100 *10)/10;
    const st = (d.students/inp.teachers).toFixed(1);

    let signal, signalTag;
    const hcPct = 100*hireTo80/inp.teachers;
    if(d.util>=75 || hcPct>=20){ signal='Critical'; signalTag='<span class="tag red">Critical</span>'; }
    else if(d.util>=55 || hcPct>=8){ signal='Watch'; signalTag='<span class="tag amber">Watch</span>'; }
    else { signal='Healthy'; signalTag='<span class="tag green">Healthy</span>'; }

    html += `<tr><td><b>${g}</b></td><td>${inp.teachers}</td><td>${fmt(d.students)}</td><td>${st}</td>`+
      `<td><span class="tag" style="background:${utilColor(d.util)};color:#fff">${d.util}%</span></td>`+
      `<td><span class="tag" style="background:${utilColor(Math.min(projUtilPct,100))};color:#fff">${projUtilPct}%</span></td>`+
      `<td>${backfill>0?`<span class="tag red">${fmt1(backfill)}</span>`:'—'}</td><td><b>${fmt1(hireTo80)}</b></td><td><b>${fmt1(newHCTotal)}</b></td><td>${signalTag}</td></tr>`;
  });
  document.getElementById('hiringSummaryTable').innerHTML = html;

  // Q3 Hiring Progress (Jul + Aug 2026 actuals; Aug = Month 0 baseline, Sep = Month 1)
  // "Hire to 80% Target" here is fixed at a 3-month horizon (matching the quarter), using each genre's
  // own current average given-hours-per-teacher-per-month -- independent of the Hiring Forecast tab's own horizon setting.
  const Q3_HORIZON = 3;
  const q3 = DATA.q3_hires || [];
  const q3Active = q3.filter(r=>r.active);
  const q3JulActive = q3Active.filter(r=>r.month==='July 2026');
  const q3AugActive = q3Active.filter(r=>r.month==='August 2026');
  let progHtml = `<tr><th>Genre</th><th>Hired This Quarter (active)</th><th>Jul Hired</th><th>Aug 2026 Target (Month 0, net of Jul hires)</th><th>Aug Hired</th><th>Sep 2026 Target (Month 1, net of Jul+Aug hires)</th><th>Hire to 80% Target (${Q3_HORIZON}mo)</th><th>% of Full Target Filled</th><th>Aug Status (month still open)</th></tr>`;
  let totalAugTarget = 0, totalSepTarget = 0, totalAugHired = 0, totalJulHired = 0;
  GENRES.forEach(g=>{
    const inp = DEFAULT_GENRE_INPUTS[g];
    const d = G[g];
    const series = computeForecast(g, Q3_HORIZON, inp);
    const sH = series[Q3_HORIZON];
    const julHired = q3JulActive.filter(r=>r.genre===g).length;
    const augHired = q3AugActive.filter(r=>r.genre===g).length;
    const hiredCount = q3Active.filter(r=>r.genre===g).length;
    const backfillRemaining = Math.max(0, effectiveBackfillGap(g,1) - hiredCount); // for Hire-to-80% Target reference, net of all Q3 hires so far, including an estimated month of unconfirmed July attrition
    const hireTo80 = Math.round(sH.totalHiresNeeded) + backfillRemaining;
    const pctFilled = hireTo80>0 ? Math.round(100*hiredCount/hireTo80) : (hiredCount>0?100:0);
    // The Aug/Sep split must never claim more total need than the overall 3-month target (hireTo80) says is left,
    // net of everyone hired so far -- otherwise a genre that's already met its full target (like 333% filled) would
    // still show monthly asks, which is the exact contradiction this was fixed to avoid.
    const remainingTotal = Math.max(0, hireTo80 - hiredCount);
    const series1 = computeForecast(g, 1, inp);
    const growthPortion1 = Math.max(0, Math.round((series1[1].totalHiresNeeded - series1[0].totalHiresNeeded)*10)/10);
    const augTargetRaw = Math.max(0, effectiveBackfillGap(g,1) - julHired) + growthPortion1*0.5;
    const sepTargetRaw = Math.max(0, effectiveBackfillGap(g,2) - julHired - augHired) + growthPortion1*0.5;
    const augTarget = Math.min(augTargetRaw, remainingTotal);
    let sepTarget = Math.min(sepTargetRaw, Math.max(0, remainingTotal - augTarget));
    totalAugTarget += augTarget; totalSepTarget += sepTarget; totalAugHired += augHired; totalJulHired += julHired;
    const onPace = (augHired>=augTarget || remainingTotal===0) ? '<span class="tag green">On pace</span>' : `<span class="tag amber">${fmt1(augTarget-augHired)} more needed by Aug 31</span>`;
    progHtml += `<tr><td><b>${g}</b></td><td>${hiredCount}</td><td>${julHired}</td><td>${fmt1(augTarget)}</td><td>${augHired}</td><td>${fmt1(sepTarget)}</td><td>${fmt1(hireTo80)}</td><td><span class="tag" style="background:${pctFilled>=75?'#4C9A6B':pctFilled>=35?'#E07A29':'#C13B3B'};color:#fff">${pctFilled}%</span></td><td>${onPace}</td></tr>`;
  });
  const totalHired = q3Active.length;
  const totalTarget = GENRES.reduce((a,g)=>{
    const inp = DEFAULT_GENRE_INPUTS[g];
    const d=G[g];
    const sH = computeForecast(g,Q3_HORIZON,inp)[Q3_HORIZON];
    const hc = q3Active.filter(r=>r.genre===g).length;
    return a + Math.round(sH.totalHiresNeeded) + Math.max(0, effectiveBackfillGap(g,1) - hc);
  },0);
  progHtml += `<tr style="font-weight:bold;background:var(--cream)"><td>Total</td><td>${totalHired}</td><td>${totalJulHired}</td><td>${fmt1(totalAugTarget)}</td><td>${totalAugHired}</td><td>${fmt1(totalSepTarget)}</td><td>${fmt1(totalTarget)}</td><td>${totalTarget>0?Math.round(100*totalHired/totalTarget):0}%</td><td>${totalAugHired>=totalAugTarget?'<span class="tag green">On pace</span>':`<span class="tag amber">${fmt1(totalAugTarget-totalAugHired)} more needed by Aug 31</span>`}</td></tr>`;
  document.getElementById('q3ProgressTable').innerHTML = progHtml;

  let q3Rows = q3;
  if(q3View==='active') q3Rows = q3.filter(r=>r.active);
  if(q3View==='te') q3Rows = q3.filter(r=>!r.active);
  let detHtml = `<tr><th>Name</th><th>Month</th><th>Genre</th><th>Status</th></tr>`;
  q3Rows.forEach(r=>{
    detHtml += `<tr><td>${r.name}</td><td>${r.month}</td><td>${r.genre||'—'}</td><td>${r.active?'<span class="tag green">Teacher</span>':'<span class="tag amber">TE</span>'}</td></tr>`;
  });
  document.getElementById('q3DetailTable').innerHTML = detHtml;

  // New Hire Shift Coverage vs Demand
  const shiftSummary = DATA.new_hire_shift_summary || {};
  let smHtml = `<tr><th>Genre</th><th>New Hires w/ Availability Data</th><th>Demand Needs — Afternoon</th><th>New Hires Covering Afternoon</th><th>Demand Needs — Night</th><th>New Hires Covering Night</th><th>Demand Needs — Morning</th><th>New Hires Covering Morning</th></tr>`;
  GENRES.forEach(g=>{
    const s = shiftSummary[g];
    const sp = DEFAULT_GENRE_INPUTS[g] ? G[g].shift_pct : null;
    if(!s || !sp){ return; }
    const pctAft = s.teachers>0 ? Math.round(100*s.any_afternoon/s.teachers) : 0;
    const pctNight = s.teachers>0 ? Math.round(100*s.any_night/s.teachers) : 0;
    const pctMorn = s.teachers>0 ? Math.round(100*s.any_morning/s.teachers) : 0;
    const gap = (needPct, coverPct) => coverPct < needPct-20 ? 'style="background:#FBE2E2"' : '';
    smHtml += `<tr><td><b>${g}</b></td><td>${s.teachers}</td>`+
      `<td>${sp.Afternoon}%</td><td ${gap(sp.Afternoon,pctAft)}>${s.any_afternoon}/${s.teachers} (${pctAft}%)</td>`+
      `<td>${sp.Night}%</td><td ${gap(sp.Night,pctNight)}>${s.any_night}/${s.teachers} (${pctNight}%)</td>`+
      `<td>${sp.Morning}%</td><td ${gap(sp.Morning,pctMorn)}>${s.any_morning}/${s.teachers} (${pctMorn}%)</td></tr>`;
  });
  document.getElementById('shiftMismatchTable').innerHTML = smHtml;

  makeAllTablesSortable(document.getElementById('view-hiringsummary'));}

// ===================== METHODOLOGY =====================
function renderMethod(){
  const el = document.getElementById('view-method');
  el.innerHTML = `
    <div class="ph"><h1>Methodology</h1><p>How the forecast numbers are calculated, and what to double-check before acting on them</p></div>
    <div class="card"><h2>Formula, step by step</h2>
      <ul class="insight-list">
        <li><b>1. Domestic vs international demand, tracked separately.</b> Each genre's active students are split into domestic (India) and international (rest of world) using current student geography. Each group is projected forward with its own <i>net</i> growth rate — the growth % you set, minus the Churn Risk % — compounding monthly: Projected domestic students at month m = current domestic students &times; (1 + (domestic growth % &minus; churn risk %))^m, same formula for international.</li>
        <li><b>1b. Churn Risk %.</b> Defaults per genre to a true renewal-based rate — students active in March 2026 who hadn't renewed by July 2026, converted to a monthly rate. It's subtracted from both growth rates every month, so a genre with 0% growth input and a non-zero churn risk will actually show a shrinking projected base. Fully editable.</li>
        <li><b>2. Booked hours per student.</b> Defaults to 3.5 hours/student/month for every genre — an editable assumption, not derived from your data (your actual current ratios run 2.5-3.0 depending on genre). Change it per genre to match reality or test scenarios.</li>
        <li><b>3. Required capacity.</b> Projected booked hours = (projected domestic + projected international students) &times; booked hours/student. Required given hours = projected booked hours &divide; target utilization ceiling. Required teachers = required given hours &divide; Given Hours/Teacher/Month (editable, pre-filled from current data).</li>
        <li><b>4. Attrition erosion.</b> Teachers remaining without new hiring at month m = current teachers &minus; (current teachers &times; monthly attrition rate &times; m), a linear projection of the Jan-Jun 2026 rate.</li>
        <li><b>5. Hiring need, split three ways.</b> Total new hires = max(0, required teachers &minus; teachers remaining). This splits into: <i>replacement</i> (covers ongoing attrition), <i>growth</i> (covers demand growth), and growth is further split into a domestic share and an international share, weighted by how much each contributed to the increase in demand hours.</li>
        <li><b>6. Immediate backfill.</b> If Jan-Jun 2026 departures haven't been backfilled yet (Attrition tab toggle), that count is added as a Month-0 priority.</li>
        <li><b>7. Monthly hiring schedule.</b> The cumulative "total hires needed" curve is differenced month over month to show how many <i>new</i> hires are needed in each specific month, rather than one lump total — useful for pacing a recruiting plan. Immediate backfill is front-loaded into Month 1.</li>
        <li><b>8. Timezone / region allocation.</b> Domestic-driven hires (replacement's domestic share + domestic growth) are allocated to IST. International-driven hires are allocated across US (combined East+West, since country-level data can't separate coasts), UK, Australia, Singapore, and Middle East using each genre's <i>current</i> regional mix (e.g. if 20% of a genre's international students are in the US, roughly 20% of its international hiring need goes to the US bucket). Europe is folded into the UK bucket as the closest proxy.</li>
        <li><b>9. Time-slot (hour-of-day) allocation.</b> The same total hiring need is also spread across the 24 IST hour slots: immediate backfill follows each hour's share of <i>current given</i> slot-hours, and growth-driven hires follow each hour's share of <i>current booked</i> slot-hours. This assumes tomorrow's demand pattern looks like today's — it won't capture a deliberate shift toward under-served hours (for that, cross-check against the Timezone Slot Map tab).</li>
      </ul>
    </div>
    <div class="card"><h2>What to treat as an assumption, not a fact</h2>
      <ul class="insight-list">
        <li><b>Domestic and international growth %</b> default to real net growth per genre (from Mar-Jul 2026 active-student snapshots, split by country code) <i>plus</i> Churn Risk %, so that Growth minus Churn reproduces the actual observed net trend rather than an unrelated gross-onboarding estimate. An earlier version of this default used half the gross new-enrollment rate, which didn't reconcile with the real ~300-400/month net growth visible in the snapshot data — this version does.</li>
        <li><b>Churn Risk %</b> defaults to a true renewal-based rate: of students active in the March 2026 snapshot, the % no longer active by the July 2026 snapshot (their classes expired or completed and they didn't renew), converted from that 4.4-month cumulative figure to a monthly rate via the same compounding math used for growth. This replaced two earlier, less accurate proxies: the at-risk snapshot (counts students who can still return, so it overstates real churn) and the D30 engagement-inactive rate (catches early quiet periods within a still-valid package, not confirmed non-renewal). Growth and Churn are still independently editable — if you change one, the other won't auto-adjust to keep the net rate anchored to reality.</li>
        <li><b>Booked hours/student/month</b> defaults to 3.5 for every genre as a flat assumption — your actual current data shows this varies by genre (2.5-3.0). Worth setting genre-specific values if you want the model closer to today's reality, or leave at 3.5 to test a "higher engagement" scenario.</li>
        <li><b>Attrition rate</b> is based on one 6-month data point (Jan-Jun 2026) projected linearly forward. A genre with a single large departure event will show an inflated ongoing rate.</li>
        <li><b>Timezone allocation assumes new international growth follows the same regional mix as today.</b> If your international growth strategy specifically targets one region (e.g. a UK marketing push), the allocation won't reflect that until you see it show up in actual enrollment data.</li>
        <li><b>The monthly hiring schedule assumes smooth, continuous growth</b> (compounding monthly), so month-to-month increments will look even. Real hiring is lumpier — use this as a pacing guide, not a rigid month-by-month target.</li>
        <li><b>Given Hours/Teacher/Month</b> is pre-filled from current data but editable — it assumes new hires ramp to the average slot profile of the current active pool immediately, which is optimistic for early tenure. Lower it to model slower-ramping new hires.</li>
        <li><b>Teacher counts include multi-genre teachers in both genres they teach</b> — so the sum across genres slightly overstates unique headcount.</li>
      </ul>
    </div>
  `;

  makeAllTablesSortable(document.getElementById('view-method'));}


renderOverview();
</script>
